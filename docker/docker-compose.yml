services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
      - '3001:3001'
      - '3002:3002'
    env_file:
      - .env
    environment:
      BROWSER: none
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ..:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
